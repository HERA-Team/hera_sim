name: Run Demo
on: [push, pull_request]


jobs:
  tests:
    name: Run Demo
    runs-on: ubuntu-latest
    env:
      # Keep UCX off the host's RDMA devices: on the Azure runners that expose a
      # MANA NIC, opening the verbs transport fails and aborts the interpreter
      # from C. Only shared-memory/loopback transports are ever needed here.
      UCX_TLS: self,sm,tcp
    defaults:
      run:
        shell: bash -l {0}
    env:
      ENV_NAME: testing
    strategy:
      fail-fast: false
      matrix:
        demo: ["end_to_end_example", "hera_sim_defaults", "hera_sim_simulator", "hera_sim_tour", "mutual_coupling_example", "polybeam_simulation", "visibility_simulator"]
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: pyproject.toml

      # No system MPI: the MPI runtime is pinned in uv.lock (the `mpich` entry
      # in the `tests` dependency group) so every job runs an identical MPI stack.

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install
        run:  |
          uv sync --locked --all-extras --group doctest

      - name: Install ipykernel
        run: uv run python -m ipykernel install --user --name herasim

      - name: Run Notebook
        run: |
          uv run papermill -k herasim docs/tutorials/${{ matrix.demo }}.ipynb output-${{ matrix.demo }}.ipynb

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.demo }}
          path: output-${{ matrix.demo }}.ipynb
